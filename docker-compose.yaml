name: myproject

services:
  db:
    image: postgres:16-alpine
    container_name: 69-s2-db
    ports:
      - "54327:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/data:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s2-admin
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit
    container_name: 69-s2-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  app:
    build: ./strapi
    image: myproject-strapi
    container_name: 69-s2-app
    restart: unless-stopped
    ports:
      - "9091:1337"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "no-reply@myproject.local"
    depends_on:
      - db
      - mailpit

  frontend:
    build: ./frontend
    container_name: 69-s2-frontend
    restart: unless-stopped
    ports:
      - "9092:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:9091
    depends_on:
      - app

volumes:
  pgadmin_data:
